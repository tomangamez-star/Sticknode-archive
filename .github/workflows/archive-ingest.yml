name: Stick Nodes archive ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should GitHub ingest?
        required: true
        default: backfill
        type: choice
        options: [backfill, recent, both]
      backfill_pages:
        description: Historical pages to process this run
        required: true
        default: '25'
        type: string
      recent_pages:
        description: Newest pages to re-check
        required: true
        default: '3'
        type: string
      start_page:
        description: Optional backfill cursor override (0 = resume)
        required: true
        default: '0'
        type: string
      exit_test_only:
        description: Only test StickNodes through the phone exit node
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sticknodes-python-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ARCHIVE_CHAT_ID: ${{ secrets.ARCHIVE_CHAT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      INGEST_NOTIFICATION_CHAT_ID: ${{ secrets.INGEST_NOTIFICATION_CHAT_ID }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      STICKNODES_BASE_URL: https://sticknodes.com
      STICKNODES_LIST_URL: https://sticknodes.com/stickfigures/
      SCRAPER_SITE_DELAY_MS: '350'
      SCRAPER_UPLOAD_DELAY_MS: '650'
      SCRAPER_MAX_FILE_MB: '45'
      SCRAPER_FETCH_DETAILS: 'false'
      SCRAPER_PROVIDER_RETRIES: '2'
      SCRAPER_PROVIDER_RETRY_DELAY_SECONDS: '5'
      INGEST_FETCH_PROVIDER: retriever
      RETRIEVER_PROVIDER: direct
      RETRIEVER_ALLOWED_HOSTS: sticknodes.com
      RETRIEVER_RESPECT_ROBOTS: 'true'
      RETRIEVER_TIMEOUT_SECONDS: '60'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ !inputs.exit_test_only }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        if: ${{ !inputs.exit_test_only }}
        run: pip install -r requirements.txt


      - name: Apply archive schema migration
        if: ${{ !inputs.exit_test_only }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          db = os.environ['DATABASE_URL'].strip()
          sslmode = 'prefer' if ('localhost' in db or '127.0.0.1' in db) else 'require'
          sql = Path('migrations/003_other_and_access.sql').read_text()
          with psycopg.connect(db, sslmode=sslmode) as conn:
              with conn.cursor() as cur:
                  cur.execute(sql)
              conn.commit()
          print('[migration] other file type + bot access settings ready')
          PY

      - name: Register archive run telemetry
        if: ${{ !inputs.exit_test_only }}
        shell: bash
        env:
          RUN_MODE: ${{ inputs.mode }}
          BACKFILL_PAGES: ${{ inputs.backfill_pages }}
          RECENT_PAGES: ${{ inputs.recent_pages }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          mode = os.environ['RUN_MODE']
          backfill = max(0, int(os.environ['BACKFILL_PAGES']))
          recent = max(0, int(os.environ['RECENT_PAGES']))
          target = backfill if mode == 'backfill' else recent if mode == 'recent' else backfill + recent
          run_id = f"gh:{os.environ.get('GITHUB_RUN_ID','unknown')}:{mode}:{target}"
          db = os.environ['DATABASE_URL'].strip()
          sslmode = 'prefer' if ('localhost' in db or '127.0.0.1' in db) else 'require'
          with psycopg.connect(db, sslmode=sslmode) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      UPDATE stick_archive_scraper_state
                      SET run_id=%s, status='preparing', current_page=0, pages_completed_latest=0,
                          archived_latest=0, skipped_latest=0, failed_latest=0, last_error='',
                          heartbeat_at=NOW(), run_finished_at=NULL, updated_at=NOW()
                      WHERE state_key='main'
                  """, (run_id,))
              conn.commit()
          print(f'[telemetry] registered {run_id}')
          PY

      - name: Show GitHub runner public IP before Tailscale
        run: |
          echo "Direct GitHub runner public IP:"
          curl -fsS --max-time 20 https://api.ipify.org
          echo

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect GitHub runner through Tecno exit node
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TAILSCALE_AUTHKEY:-}" ]; then
            echo "::error::Missing GitHub Actions secret TAILSCALE_AUTHKEY"
            exit 1
          fi

          echo "Joining Tailscale first..."
          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="sticknode-github-test"

          echo "Waiting for tecno-spark-30c to appear in the tailnet..."
          PHONE_IP=""
          for i in $(seq 1 30); do
            PHONE_IP="$(tailscale status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((p.get("TailscaleIPs", [""])[0] for p in d.get("Peer", {}).values() if (p.get("HostName") == "tecno-spark-30c" or (p.get("DNSName") or "").rstrip(".").startswith("tecno-spark-30c.")) and p.get("TailscaleIPs")), ""))' || true)"

            if [ -n "$PHONE_IP" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$PHONE_IP" ]; then
            echo "::error::Could not find tecno-spark-30c on the tailnet after 60 seconds."
            echo "Current Tailscale status:"
            tailscale status || true
            exit 1
          fi

          echo "Found Tecno Tailscale IP: $PHONE_IP"
          echo "Selecting it as the exit node..."

          sudo tailscale set --exit-node="$PHONE_IP"

          echo
          echo "Tailscale status:"
          tailscale status

      - name: Verify phone exit and StickNodes access
        shell: bash
        run: |
          set -euo pipefail

          echo "Public IP after selecting tecno-spark-30c:"
          EXIT_IP="$(curl -fsS --max-time 30 https://api.ipify.org)"
          echo "$EXIT_IP"
          echo

          TEST_URL="https://sticknodes.com/download/people/Lynn-Loud-Dad-Lincoln-Loud.nodes"
          TEST_FILE="/tmp/sticknodes-exit-test.nodes"
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/151 Mobile Safari/537.36"

          echo "Testing one small StickNodes download through the phone..."
          HTTP_CODE="$(curl -L \
            --max-time 60 \
            --connect-timeout 20 \
            --retry 1 \
            -A "$UA" \
            -o "$TEST_FILE" \
            -sS \
            -w '%{http_code}' \
            "$TEST_URL")"

          BYTES="$(wc -c < "$TEST_FILE" | tr -d ' ')"

          echo "StickNodes HTTP status: $HTTP_CODE"
          echo "Downloaded bytes: $BYTES"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::StickNodes did not return HTTP 200 through the phone exit node."
            exit 1
          fi

          if [ "$BYTES" -lt 1000 ]; then
            echo "::error::Response was unexpectedly small; refusing to count it as a successful file download."
            exit 1
          fi

          echo "SUCCESS: GitHub downloaded a real StickNodes file through tecno-spark-30c."

      - name: Run Python ingestion
        if: ${{ !inputs.exit_test_only }}
        run: |
          echo "Starting real archive ingestion through the Tecno exit node..."
          python python_ingest/fast_ingest.py \
            --mode=${{ inputs.mode }} \
            --backfill-pages=${{ inputs.backfill_pages }} \
            --recent-pages=${{ inputs.recent_pages }} \
            --start-page=${{ inputs.start_page }}
      - name: Disconnect Tailscale
        if: ${{ always() }}
        run: sudo tailscale logout || true

      - name: Notify successful archive run
        if: ${{ success() && !inputs.exit_test_only }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import psycopg
          import requests

          db = os.environ['DATABASE_URL'].strip()
          sslmode = 'prefer' if ('localhost' in db or '127.0.0.1' in db) else 'require'
          with psycopg.connect(db, sslmode=sslmode) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT pages_completed_latest, archived_latest, skipped_latest, failed_latest,
                             backfill_next_page, run_started_at, run_finished_at, run_id
                      FROM stick_archive_scraper_state WHERE state_key='main'
                  """)
                  row = cur.fetchone()
          pages, archived, skipped, failed, next_page, started, finished, run_id = row
          elapsed = max(0, ((finished or datetime.now(timezone.utc)) - started).total_seconds()) if started else 0
          avg = elapsed / pages if pages else 0
          mins = int(elapsed // 60)
          avg_text = f'{int(avg//60)}m {int(avg%60)}s' if avg else 'n/a'
          text = (
              '✅ Stick Nodes archive run finished\n\n'
              f'Pages completed: {pages}\n'
              f'Archived: {archived}\n'
              f'Skipped/duplicates: {skipped}\n'
              f'Failed: {failed}\n'
              f'Average/page: {avg_text}\n'
              f'Run time: {mins}m\n'
              f'Next backfill page: {next_page}'
          )
          token = os.environ.get('TELEGRAM_TOKEN','').strip()
          chat = (os.environ.get('INGEST_NOTIFICATION_CHAT_ID','').strip() or os.environ.get('OWNER_ID','').strip())
          if token and chat:
              r = requests.post(f'https://api.telegram.org/bot{token}/sendMessage', data={'chat_id':chat,'text':text}, timeout=30)
              r.raise_for_status()
              print('[telegram] completion notification sent')
          else:
              print('[telegram] completion notification skipped: notification chat/token missing')
          PY
