name: Stick Nodes archive ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should GitHub ingest?
        required: true
        default: backfill
        type: choice
        options: [backfill, recent, both]
      backfill_pages:
        description: Historical pages to process this run
        required: true
        default: '25'
        type: string
      recent_pages:
        description: Newest pages to re-check
        required: true
        default: '3'
        type: string
      start_page:
        description: Optional backfill cursor override (0 = resume)
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: sticknodes-python-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ARCHIVE_CHAT_ID: ${{ secrets.ARCHIVE_CHAT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      INGEST_NOTIFICATION_CHAT_ID: ${{ secrets.INGEST_NOTIFICATION_CHAT_ID }}
      STICKNODES_BASE_URL: https://sticknodes.com
      STICKNODES_LIST_URL: https://sticknodes.com/stickfigures/
      SCRAPER_SITE_DELAY_MS: '350'
      SCRAPER_UPLOAD_DELAY_MS: '1100'
      SCRAPER_MAX_FILE_MB: '45'
      SCRAPER_FETCH_DETAILS: 'true'
      SCRAPER_PROVIDER_RETRIES: '2'
      SCRAPER_PROVIDER_RETRY_DELAY_SECONDS: '5'
      INGEST_FETCH_PROVIDER: retriever
      RETRIEVER_PROVIDER: scraperapi
      RETRIEVER_ALLOWED_HOSTS: sticknodes.com
      RETRIEVER_RESPECT_ROBOTS: 'true'
      RETRIEVER_TIMEOUT_SECONDS: '60'
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate ScraperAPI secret
        run: |
          if [ -z "$SCRAPERAPI_KEY" ]; then
            echo "Missing GitHub secret: SCRAPERAPI_KEY"
            exit 1
          fi
      - name: Run Python ingestion
        run: >-
          python python_ingest/ingest.py
          --mode=${{ inputs.mode }}
          --backfill-pages=${{ inputs.backfill_pages }}
          --recent-pages=${{ inputs.recent_pages }}
          --start-page=${{ inputs.start_page }}
