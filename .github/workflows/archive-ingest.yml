name: Stick Nodes archive ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should this run ingest?
        required: true
        default: backfill
        type: choice
        options:
          - backfill
          - recent
          - both
      backfill_pages:
        description: Historical pages to process this run
        required: true
        default: '25'
        type: string
      recent_pages:
        description: Newest pages to re-check (used by recent/both)
        required: true
        default: '3'
        type: string
      retry_failures:
        description: Retry previously failed downloads first
        required: true
        default: true
        type: boolean
      start_page:
        description: Optional backfill cursor override (0 = resume saved cursor)
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: sticknodes-archive-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ARCHIVE_CHAT_ID: ${{ secrets.ARCHIVE_CHAT_ID }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      INGEST_NOTIFICATION_CHAT_ID: ${{ secrets.INGEST_NOTIFICATION_CHAT_ID }}
      STICKNODES_BASE_URL: https://sticknodes.com
      STICKNODES_LIST_URL: https://sticknodes.com/stickfigures/
      SCRAPER_SITE_DELAY_MS: '350'
      SCRAPER_UPLOAD_DELAY_MS: '1100'
      SCRAPER_MAX_FILE_MB: '45'
      SCRAPER_FETCH_DETAILS: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Static checks
        run: npm run check

      - name: Tests
        run: npm test

      - name: Run archive ingestion
        run: >-
          node src/ingest.js
          --mode=${{ inputs.mode }}
          --backfill-pages=${{ inputs.backfill_pages }}
          --recent-pages=${{ inputs.recent_pages }}
          --retry-failures=${{ inputs.retry_failures }}
          --retry-limit=20
          --start-page=${{ inputs.start_page }}
          --lock-wait-seconds=300
