name: Stick Nodes archive ingest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should Render ingest?
        required: true
        default: backfill
        type: choice
        options: [backfill, recent, both]
      backfill_pages:
        description: Historical pages to process this run
        required: true
        default: '25'
        type: string
      recent_pages:
        description: Newest pages to re-check (recent/both)
        required: true
        default: '3'
        type: string
      retry_failures:
        description: Retry previously failed files first
        required: true
        default: true
        type: boolean
      start_page:
        description: Optional backfill cursor override (0 = resume)
        required: true
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: sticknodes-render-ingest
  cancel-in-progress: false

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      RENDER_INGEST_URL: ${{ secrets.RENDER_INGEST_URL }}
      RENDER_INGEST_SECRET: ${{ secrets.RENDER_INGEST_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static checks
        run: npm run check

      - name: Trigger Render ingestion and follow progress
        run: >-
          node src/remote-trigger.js
          --mode=${{ inputs.mode }}
          --backfill-pages=${{ inputs.backfill_pages }}
          --recent-pages=${{ inputs.recent_pages }}
          --retry-failures=${{ inputs.retry_failures }}
          --retry-limit=20
          --start-page=${{ inputs.start_page }}
